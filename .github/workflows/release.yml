name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"
      build_twa:
        description: "Also build TWA APK (requires ASSET_URL secret)"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  actions: write

env:
  NODE_VERSION: "20"
  BUN_VERSION: "latest"

jobs:
  build:
    name: Build Next.js standalone
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Build Next.js (standalone)
        run: bun run build
        env:
          DATABASE_URL: "file:./db/custom.db"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Prepare standalone bundle
        run: |
          mkdir -p bundle
          cp -r .next/standalone bundle/server
          cp -r .next/static bundle/server/.next/static
          cp -r public bundle/server/public
          # Include prisma schema + migrations for runtime
          mkdir -p bundle/server/prisma
          cp prisma/schema.prisma bundle/server/prisma/
          # Include seed scripts
          cp -r src/lib/seed.ts bundle/server/seed.ts 2>/dev/null || true
          cp -r src/lib/seed-app.ts bundle/server/seed-app.ts 2>/dev/null || true
          # Create the runtime db directory
          mkdir -p bundle/server/db
          # Env template
          cat > bundle/server/.env.example << 'EOF'
          DATABASE_URL="file:./db/custom.db"
          NODE_ENV=production
          PORT=3000
          HOSTNAME=0.0.0.0
          EOF
          # README
          cat > bundle/README.md << 'EOF'
          # Dar Al-Yasmin Royal Hotel — Production Bundle

          ## Run
          ```bash
          cd server
          cp .env.example .env
          # Initialize database
          bunx prisma db push --accept-data-loss
          # Seed website content
          bunx tsx seed.ts
          # Seed app data (staff, rooms, services, stays, codes)
          bunx tsx seed-app.ts
          # Start
          bun server.js
          ```
          The app listens on port 3000.
          EOF

      - name: Create distributable archives
        run: |
          VERSION="${{ steps.meta.outputs.version || github.ref_name }}"
          # tar.gz
          tar -czf dar-al-yasmin-${VERSION}.tar.gz -C bundle .
          # zip
          cd bundle && zip -r ../dar-al-yasmin-${VERSION}.zip . && cd ..
          ls -lh dar-al-yasmin-${VERSION}.*

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: standalone-bundle
          path: |
            dar-al-yasmin-*.tar.gz
            dar-al-yasmin-*.zip
          retention-days: 30

      - name: Generate checksums
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME:-${{ github.event.inputs.version || 'v0.0.0' }}}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          sha256sum dar-al-yasmin-*.tar.gz dar-al-yasmin-*.zip > checksums.sha256
          cat checksums.sha256

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=${{ needs.build.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  twa:
    name: Build TWA APK
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event.inputs.build_twa == 'true' || github.ref_type == 'tag' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;34.0.0 platforms;android-34"

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Initialize TWA project
        env:
          ASSET_URL: ${{ secrets.ASSET_URL }}
          APP_NAME: "Dar Al-Yasmin Hotel"
          APP_ID: "ye.daralyasmin.hotel"
        run: |
          if [ -z "$ASSET_URL" ]; then
            echo "ASSET_URL secret not set — skipping TWA build"
            echo "skipped=true" >> $GITHUB_ENV
            exit 0
          fi
          bubblewrap init --manifest="$ASSET_URL/manifest.json" \
            --directory=./twa \
            --app-name="$APP_NAME" \
            --package-id="$APP_ID" \
            --signing-key-path=./twa-key.jks \
            --signing-key-alias=android \
            --signing-key-pass=android \
            --signing-key-store-pass=android || true

      - name: Build TWA APK
        if: env.skipped != 'true'
        run: |
          cd twa
          bubblewrap build --manifest ./twa-manifest.json || true
          ls -lh app-release-signed.apk 2>/dev/null || echo "APK not found"

      - name: Upload APK artifact
        if: env.skipped != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: twa-apk
          path: twa/*.apk
          retention-days: 90

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build, docker]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | head -50

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name: Dar Al-Yasmin Hotel ${{ needs.build.outputs.version }}
          body: |
            # Dar Al-Yasmin Royal Hotel — ${{ needs.build.outputs.version }}

            ## What's in this release

            ### 📦 Standalone Server Bundle
            - `dar-al-yasmin-*.tar.gz` / `dar-al-yasmin-*.zip` — self-contained Next.js production server
            - Includes: Prisma schema, seed scripts, all static assets, standalone Node server

            ### 🐳 Docker Image
            ```bash
            docker pull ghcr.io/mohammed503-qtb/cairo-hart-hotel-9:latest
            docker run -p 3000:3000 -v $(pwd)/data:/app/db ghcr.io/mohammed503-qtb/cairo-hart-hotel-9:latest
            ```

            ### 📱 Mobile App (PWA)
            The app is installable as a PWA on Android, iOS, and desktop:
            1. Open the deployed URL on your phone
            2. Browser menu → "Add to Home Screen"
            3. Launches full-screen as a native app (no browser chrome)

            ### 📲 TWA APK (Android)
            If `ASSET_URL` secret is set, a signed `.apk` is attached.

            ## Installation (Standalone)
            ```bash
            tar -xzf dar-al-yasmin-${{ needs.build.outputs.version }}.tar.gz
            cd server
            cp .env.example .env
            bunx prisma db push --accept-data-loss
            bunx tsx seed.ts
            bunx tsx seed-app.ts
            bun server.js
            ```

            ## Test Access Codes (after seeding)
            - Guest: see seed output
            - Reception: see seed output
            - Admin: see seed output

            ## Features
            - 🏨 Public website + booking engine (Arabic RTL + English)
            - 📱 Mobile app for 3 personas (Guest / Reception / Admin)
            - 🔐 Dynamic code-based authentication
            - 💳 Booking lifecycle (create → modify → cancel → confirm)
            - 🛎️ Guest service requests with status workflow
            - 💬 Guest-reception chat
            - 🧾 Billing ledger
            - 📊 Admin dashboard + reports + audit log
            - 📴 Offline-capable (service worker)
            - 📲 Installable as native app (PWA manifest + icons)
          files: |
            artifacts/standalone-bundle/*
            artifacts/twa-apk/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
